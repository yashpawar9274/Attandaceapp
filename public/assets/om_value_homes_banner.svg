<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="50%" stop-color="#0F1D36" />
      <stop offset="100%" stop-color="#1A2F5A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C058" />
      <stop offset="100%" stop-color="#F3E7BE" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182A4D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F1A30" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3560" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#142442" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="amberBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- Blueprint Grid Pattern -->
  <g stroke="#264273" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="450" x2="1200" y2="450" />

    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="1100" y1="0" x2="1100" y2="500" />
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="1050" cy="120" r="180" fill="#D4AF37" opacity="0.08" filter="url(#glow)" />
  <circle cx="200" cy="420" r="220" fill="#3B82F6" opacity="0.07" filter="url(#glow)" />

  <!-- Left Side: Branding and Hero Text -->
  <g transform="translate(80, 85)">
    <!-- Work In Progress Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="17" fill="url(#amberBadgeGrad)" filter="url(#shadow)" />
      <!-- Pulsing Dot -->
      <circle cx="22" cy="17" r="5" fill="#FFFFFF" />
      <text x="36" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">WORK IN PROGRESS</text>
    </g>

    <!-- Company & App Title -->
    <text x="0" y="88" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1.5">OM VALUE HOMES</text>
    <text x="0" y="124" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">Staff Attendance &amp; Payroll Management</text>

    <!-- Description Paragraph -->
    <text x="0" y="166" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Enterprise mobile solution engineered for construction sites and corporate
    </text>
    <text x="0" y="190" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      offices — tracking real-time daily rosters, site visits, overtime calculations,
    </text>
    <text x="0" y="214" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      leave approval workflows, and exportable monthly salary sheets.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 246)">
      <!-- Pill 1: Attendance -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#10B981" />
        <text x="30" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Daily Rosters</text>
      </g>
      <!-- Pill 2: Overtime -->
      <g transform="translate(148, 0)">
        <rect width="144" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#F59E0B" />
        <text x="30" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">1.5x OT Engine</text>
      </g>
      <!-- Pill 3: Leaves -->
      <g transform="translate(302, 0)">
        <rect width="138" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#3B82F6" />
        <text x="30" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">Leave Approvals</text>
      </g>
      <!-- Pill 4: Payroll PDF -->
      <g transform="translate(450, 0)">
        <rect width="128" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="18" cy="16" r="4" fill="#E5C058" />
        <text x="30" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">PDF Reports</text>
      </g>
    </g>
  </g>

  <!-- Right Side: UI Mockup Cards -->
  <g transform="translate(730, 60)">
    <!-- Back Card: Payroll Snapshot -->
    <g transform="translate(70, 190)" filter="url(#shadow)">
      <rect width="330" height="190" rx="16" fill="url(#cardGrad2)" stroke="#38517D" stroke-width="1.5" />
      <!-- Card Header -->
      <text x="24" y="34" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PAYROLL STATEMENT</text>
      <text x="24" y="62" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="800">₹ 78,500.00</text>
      <text x="175" y="60" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">+ ₹ 6,420 OT</text>

      <!-- Divider -->
      <line x1="24" y1="84" x2="306" y2="84" stroke="#253C66" stroke-width="1" />

      <!-- Row items -->
      <text x="24" y="112" fill="#94A3B8" font-family="sans-serif" font-size="12">Base Working Days</text>
      <text x="306" y="112" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">26 / 26 Days</text>

      <text x="24" y="136" fill="#94A3B8" font-family="sans-serif" font-size="12">Site Visit Bonus</text>
      <text x="306" y="136" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="end">Included</text>

      <text x="24" y="160" fill="#94A3B8" font-family="sans-serif" font-size="12">Net Disbursed Status</text>
      <text x="306" y="160" fill="#D4AF37" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">READY TO DISBURSE</text>
    </g>

    <!-- Front Card: Daily Attendance Roster Item -->
    <g transform="translate(10, 20)" filter="url(#shadow)">
      <rect width="340" height="200" rx="16" fill="url(#cardGrad1)" stroke="#2B4673" stroke-width="1.5" />
      <!-- Staff Avatar & Info -->
      <circle cx="48" cy="50" r="24" fill="#E5C058" />
      <text x="48" y="56" fill="#0B1325" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">RS</text>

      <text x="86" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">Rajesh Sharma</text>
      <text x="86" y="62" fill="#94A3B8" font-family="sans-serif" font-size="12">Site Engineer • OM Greens</text>

      <!-- Status Badge -->
      <rect x="236" y="32" width="80" height="26" rx="13" fill="#065F46" />
      <text x="276" y="49" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRESENT</text>

      <!-- Divider -->
      <line x1="24" y1="90" x2="316" y2="90" stroke="#1F365A" stroke-width="1" />

      <!-- Attendance Metrics -->
      <g transform="translate(24, 114)">
        <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11">CHECK-IN</text>
        <text x="0" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">08:55 AM</text>
      </g>
      <g transform="translate(110, 114)">
        <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11">CHECK-OUT</text>
        <text x="0" y="20" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600">07:15 PM</text>
      </g>
      <g transform="translate(200, 114)">
        <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="11">OVERTIME</text>
        <text x="0" y="20" fill="#F59E0B" font-family="sans-serif" font-size="14" font-weight="700">+ 1.5 Hrs</text>
      </g>

      <!-- Geo-tag Indicator -->
      <g transform="translate(24, 168)">
        <circle cx="6" cy="6" r="4" fill="#3B82F6" />
        <text x="16" y="10" fill="#94A3B8" font-family="sans-serif" font-size="11">GPS Verified: Site Plot 42, Sector 9</text>
      </g>
    </g>
  </g>
</svg>
